[package]
name = "impression-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
postcard = { version = "1", features = ["alloc"] }
rmp-serde = "1"
serde-wasm-bindgen = "0.6"
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = "1"
mixbox = "2"


